[package]
name = "qwatch"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
description = "Browse and unstick file-based work queues from the terminal"
readme = "README.md"
keywords = ["tui", "queue", "deadletter", "operations", "cli"]
categories = ["command-line-utilities"]
license = "MIT"
repository = "https://github.com/jproberson/qwatch"

[profile.release]
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
crossterm = "0.29.0"
notify = "8.2.0"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

[dev-dependencies]
tempfile = "3.27.0"
